# 本文件只放「工具配置」，依赖清单以 requirements.txt 为准（start.bat 也用它安装）。
# 之所以不在这里声明 [project].dependencies：本项目是平铺模块结构
# （config.py / llm.py / nodes.py 直接躺在根目录），做成可安装包需要额外维护
# py-modules 列表，对单人本地工具是纯粹的负担。
#
# 精确版本见 requirements.lock.txt（由 pip freeze 生成，用于完全复现环境）。

# 下面的 [project] 表仅用于「元数据识别」——许可证、作者、版本会显示在
# GitHub 等平台上。本项目不以 pip 包形式分发，因此刻意不声明 dependencies
# 与 build-system；若确实需要 pip install 本目录，请自行补充 [build-system]
# 与 [tool.setuptools] py-modules。
[project]
name = "story-agents"
version = "0.1.0"
description = "分工式多 Agent 小说创作流水线：策划 → 撰稿 → 校对回退 → 润色 → 记忆结算"
readme = "README.md"
requires-python = ">=3.10"        # 本地开发环境为 3.13
license = { file = "LICENSE" }    # MIT；web/static/fonts/ 下的字体另按 OFL 1.1 授权
authors = [
    { name = "Bolumaile", email = "143075595+Bolumaile@users.noreply.github.com" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# 测试全部离线：MockLLM 不联网，JSON 修复链是纯字符串处理。
# 若哪天有用例开始联网，说明 Mock 分支被绕过了，应当在评审时拦下。
